name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  # GitHub annotations and a job summary, TRX files for the artifact, and a dump if a test hangs.
  TEST_ARGS: >-
    --no-build
    --configuration Release
    --logger GitHubActions
    --logger trx
    --blame-hang-timeout 5m

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EventsWorld.slnx

      - name: Build (warnings are errors)
        run: dotnet build EventsWorld.slnx --no-restore --configuration $CONFIGURATION -warnaserror

      - name: Check formatting
        run: dotnet format EventsWorld.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Unit tests
        run: dotnet test tests/EventsWorld.UnitTests $TEST_ARGS --results-directory TestResults/unit

      - name: Architecture tests
        run: dotnet test tests/EventsWorld.ArchitectureTests $TEST_ARGS --results-directory TestResults/architecture

      # Testcontainers starts a real PostgreSQL 17 with the Docker engine of the runner.
      - name: Integration tests (PostgreSQL in Docker)
        run: dotnet test tests/EventsWorld.IntegrationTests $TEST_ARGS --results-directory TestResults/integration

      - name: Upload test results and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
          if-no-files-found: ignore
